<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Ticket — Skynora</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/booking.css">
</head>
<body>
  <header class="navbar">
    <div class="flex items-center gap-xl"><a href="index.html" class="navbar-brand">Skynora</a><nav class="navbar-links"><a href="index.html">Flights</a><a href="search.html">Search</a><a href="dashboard.html">Dashboard</a><a href="#">Help</a></nav></div>
    <div class="navbar-actions"><a href="login.html" class="btn btn-ghost">Sign In</a><a href="register.html" class="btn btn-primary">Get Started</a></div>
    <button class="navbar-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </header>
  <main class="page-content">
    <div class="container" style="padding:var(--space-2xl) 0;">
      <div class="text-center mb-xl">
        <div class="success-icon"><span class="material-symbols-outlined icon-filled">check_circle</span></div>
        <h1 class="text-h1 text-primary">Booking Confirmed!</h1>
        <p class="text-muted mt-sm">Your e-ticket has been generated. Check your email for a copy.</p>
      </div>
      <div class="ticket-wrapper" id="ticket-wrapper">
        <div class="loading-overlay"><div class="spinner"></div><p>Loading ticket...</p></div>
      </div>
      <div class="text-center mt-xl flex justify-center gap-md" style="flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="window.print()"><span class="material-symbols-outlined icon-sm">print</span> Print Ticket</button>
        <a href="dashboard.html" class="btn btn-outline"><span class="material-symbols-outlined icon-sm">dashboard</span> My Dashboard</a>
        <a href="index.html" class="btn btn-ghost">Book Another Flight</a>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="container-lg"><div class="footer-grid"><div><span class="footer-brand">Skynora</span></div><div><p class="footer-copyright">© 2026 Skynora.</p></div></div></div></footer>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/ticket.js"></script>
</body>
</html>
