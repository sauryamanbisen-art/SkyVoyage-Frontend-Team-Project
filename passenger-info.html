<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passenger Information — SkyVoyage</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/booking.css">
</head>
<body>
  <header class="navbar">
    <div class="flex items-center gap-xl"><a href="index.html" class="navbar-brand">SkyVoyage</a><nav class="navbar-links"><a href="index.html">Flights</a><a href="search.html">Search</a><a href="dashboard.html">Dashboard</a><a href="#">Help</a></nav></div>
    <div class="navbar-actions"><a href="login.html" class="btn btn-ghost">Sign In</a><a href="register.html" class="btn btn-primary">Get Started</a></div>
    <button class="navbar-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </header>
  <main class="page-content">
    <div class="booking-flow-header">
      <div class="container">
        <h1 class="text-h1">Passenger Information</h1>
        <div class="booking-steps">
          <div class="booking-step completed"><span class="step-number">✓</span>Search</div><span class="step-divider"></span>
          <div class="booking-step completed"><span class="step-number">✓</span>Seats</div><span class="step-divider"></span>
          <div class="booking-step active"><span class="step-number">3</span>Passengers</div><span class="step-divider"></span>
          <div class="booking-step"><span class="step-number">4</span>Payment</div><span class="step-divider"></span>
          <div class="booking-step"><span class="step-number">5</span>Confirmation</div>
        </div>
      </div>
    </div>
    <div class="container" style="padding-bottom:var(--space-2xl);">
      <div class="booking-layout">
        <div class="booking-main">
          <form id="passenger-form">
            <div id="passengers-forms"><!-- Dynamically rendered by JS --></div>
            <h3 class="text-h3 text-primary mt-xl mb-md">Contact Information</h3>
            <div class="passenger-form-grid">
              <div class="form-group"><label class="form-label" for="contact-email">Email Address *</label><input type="email" id="contact-email" class="form-input" placeholder="you@email.com" required><div class="form-error" id="email-error">Please enter a valid email address</div></div>
              <div class="form-group"><label class="form-label" for="contact-phone">Phone Number *</label><input type="tel" id="contact-phone" class="form-input" placeholder="9876543210" required><div class="form-error" id="phone-error">Please enter a valid 10-digit phone number</div></div>
            </div>
            <div class="flex justify-between items-center mt-xl">
              <a href="seat-selection.html" class="btn btn-outline"><span class="material-symbols-outlined icon-sm">arrow_back</span> Back</a>
              <button type="submit" class="btn btn-accent btn-lg">Continue to Payment <span class="material-symbols-outlined icon-sm">arrow_forward</span></button>
            </div>
          </form>
        </div>
        <aside class="booking-sidebar">
          <div class="booking-summary-card" id="booking-summary">
            <div class="booking-summary-title">Booking Summary</div>
            <div id="summary-content"><div class="loading-overlay"><div class="spinner"></div></div></div>
          </div>
        </aside>
      </div>
    </div>
  </main>
  <footer class="footer"><div class="container-lg"><div class="footer-grid"><div><span class="footer-brand">SkyVoyage</span></div><div><p class="footer-copyright">© 2026 SkyVoyage.</p></div></div></div></footer>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/passenger-info.js"></script>
</body>
</html>
